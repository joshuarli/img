[package]
name = "img"
version = "0.14.0"
edition = "2024"
license = "Apache-2.0"

[lib]
doctest = false

[[bin]]
name = "img"
path = "./src/main.rs"
required-features = ["build-binary"]

[features]
default = ["resize", "quantization", "metadata"]
build-binary = ["dep:serde_json", "limits", "dep:lexopt", "dep:glob", "icc"]
metadata = ["zune-image/metadata"]
resize = ["dep:fast_image_resize"]
quantization = []
icc = ["metadata"]
limits = ["dep:sysinfo"]

[dependencies]
png = "=0.18.1"
fdeflate = "=0.3.7"
oxipng = { version = "=10.2.1", default-features = false, features = ["parallel"] }
libc = "0.2"
libm = "=0.2.16"
crc32fast = "1.5"
zune-jpeg = "=0.5.15"
jpegli-sys = { path = "codecs/jpegli-sys" }
libjpeg-turbo-sys = { path = "codecs/libjpeg-turbo-sys" }
# Permissive pure-Rust WebP: decode via image-webp (image-rs), encode via the
# vendored webpkit snapshot staged for the parity campaign (MIT OR Apache-2.0).
webpkit = { path = "codecs/webpkit", version = "0.1.0", features = ["rayon"] }
image-webp = "=0.2.4"
# Upstream memorysafety.org Rust port of dav1d, BSD-2-Clause, vendored with its
# ARM and x86 assembly. The assembler build requires bitdepth_16.
rav1d = { version = "=1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16", "asm", "asm_arm64_dotprod", "asm_arm64_i8mm", "asm_arm64_sve2"] }
libavif-sys = { path = "codecs/libavif-sys" }
yuv = { version = "=0.8.20", default-features = false }
moxcms = { version = "=0.8.1", features = ["extended_range"] }
fast-ssim2 = { version = "=0.9.1", default-features = false }
bytemuck = "1.25"
zencodec = "=0.1.26"
zenpixels = { version = "=0.2.16", default-features = false, features = ["std", "icc"] }
rgb = { version = "0.8" }
log = "0.4"
# zune-core 0.5.3 would cause build error.
# REF: https://github.com/etemesi254/zune-image/issues/439
zune-core = { version = "=0.5.1", features = ["std"] }
zune-image = { version = "0.5.0", default-features = false, features = ["simd"] }
fast_image_resize = { version = "6.1", optional = true }
quantette = { version = "=0.6.0", default-features = false, features = ["std", "kmeans"] }
quantizr = { version = "=1.4.3" }
# System resource probing for dynamic image size limits
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "system"], optional = true }

# cli
serde_json = { version = "1.0", optional = true }
lexopt = { version = "0.3.2", optional = true }
glob = { version = "0.3", optional = true }

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[dev-dependencies]
serde_json = { version = "1.0", features = ["float_roundtrip"] }
dav1d = "0.11"
webp = { version = "0.3", default-features = false }
yuvutils-rs = { version = "0.8", default-features = false }
zune-image = { version = "0.5.0", default-features = false, features = ["jpeg"] }
sha2 = "0.10"
filetime = "0.2.29"
lcms2 = "6.2"
zenavif-serialize = "=0.1.4"
enough = "0.4"
rustybench = "=0.5.0"

[[bench]]
name = "workflow"
harness = false
required-features = ["build-binary"]

[[example]]
name = "benchmark"
required-features = ["build-binary"]

[patch.crates-io]
oxipng = { path = "vendor/oxipng" }
libdeflater = { path = "vendor/libdeflater" }
libdeflate-sys = { path = "vendor/libdeflate-sys" }
rav1d = { path = "vendor/rav1d" }
