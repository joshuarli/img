[package]
name = "rimage"
version = "0.14.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
doctest = false

[[bin]]
name = "rimage"
path = "./src/main.rs"
required-features = ["build-binary"]

[features]
default = [
    "resize",
    "quantization",
    "mozjpeg",
    "oxipng",
    "webp",
    "avif",
    "tiff",
    "threads",
    "metadata",
]

# Used for binary
build-binary = [
    "dep:serde_json",
    "limits",
    "dep:lexopt",
    "dep:glob",
    "zune-image/default",
    "icc",
]

# Enables utilization of threads
threads = [
    "imagequant?/threads",
    "mozjpeg?/parallel",
    "oxipng?/parallel",
    "fast_image_resize?/rayon",
    "ravif?/threading",
    "yuvutils-rs?/rayon",
    "zune-image/threads",
]
# Enables metadata support
metadata = ["zune-image/metadata"]

# Enables resize operation
resize = ["dep:fast_image_resize"]
# Enables quantize operation
quantization = ["dep:imagequant"]

# Enables mozjpeg codec
mozjpeg = ["dep:mozjpeg"]
# Enables oxipng codec
oxipng = ["dep:oxipng"]
# Enables webp codec
webp = ["dep:webp"]
# Enables avif codec
avif = [
    "dep:ravif",
    "dep:dav1d",
    "dep:avif-parse",
    "dep:yuvutils-rs",
]
# Enables tiff codec
tiff = ["dep:tiff"]
icc = []
# Enables runtime system-resource probing, used to derive image size limits
limits = ["dep:sysinfo"]

[dependencies]
libc = "0.2"
zenpng = { version = "=0.1.4", default-features = false, features = ["quantize"] }
crc32fast = "1.5"
zenjpeg = { version = "=0.8.4", default-features = false, features = ["decoder", "zencodec", "yuv"] }
zenwebp = { version = "=0.4.6", default-features = false, features = ["std", "fast-yuv", "zencodec"] }
zenavif = { version = "=0.1.6", default-features = false, features = ["encode", "zencodec"] }
zenavif-parse = { version = "=0.6.2", default-features = false }
rav1d-safe = { version = "=0.5.7", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
yuv = { version = "=0.8.20", default-features = false }
moxcms = { version = "=0.8.1", features = ["extended_range"] }
fast-ssim2 = { version = "=0.9.1", default-features = false }
bytemuck = "1.25"
zencodec = "=0.1.26"
imgref = "1"
zenpixels = { version = "=0.2.16", default-features = false }
rgb = { version = "0.8" }
log = "0.4"
# zune-core 0.5.3 would cause build error.
# REF: https://github.com/etemesi254/zune-image/issues/439
zune-core = { version = "=0.5.1", features = ["std"] }
zune-image = { version = "0.5.0", features = ["simd"] }
fast_image_resize = { version = "6.1", optional = true }
imagequant = { version = "4.4", default-features = false, optional = true }
mozjpeg = { version = "0.10.13", default-features = false, features = [
    "with_simd",
], optional = true }
oxipng = { version = "10.2.1", default-features = false, features = [
    "zopfli",
], optional = true }
webp = { version = "0.3", default-features = false, optional = true }
ravif = { version = "0.13.0", optional = true }
dav1d = { version = "0.11", optional = true }
avif-parse = { version = "2.1", optional = true }
yuvutils-rs = { version = "0.8", optional = true }
tiff = { version = "0.11.3", default-features = false, features = [
    "lzw",
], optional = true }

# System resource probing for dynamic image size limits
sysinfo = { version = "0.39.6", optional = true }

# cli
serde_json = { version = "1.0", optional = true }
lexopt = { version = "0.3.2", optional = true }
glob = { version = "0.3", optional = true }

[target.'cfg(all(target_arch = "aarch64", target_os = "linux", target_env = "musl"))'.dependencies]
ravif = { version = "0.13.0", default-features = false, optional = true }

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[dev-dependencies]
sha2 = "0.10"
filetime = "0.2.29"
lcms2 = "6.2"
zenavif-serialize = "=0.1.4"
enough = "0.4"
png = "0.18"
rustybench = "=0.5.0"

[[bench]]
name = "workflow"
harness = false
required-features = ["build-binary"]

[[example]]
name = "benchmark"
required-features = ["build-binary"]
