[package]
name = "rimage"
version = "0.14.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
doctest = false

[[bin]]
name = "rimage"
path = "./src/main.rs"
required-features = ["build-binary"]

[features]
default = ["resize", "quantization", "metadata"]
build-binary = ["dep:serde_json", "limits", "dep:lexopt", "dep:glob", "icc"]
metadata = ["zune-image/metadata"]
resize = ["dep:fast_image_resize"]
quantization = ["dep:imagequant"]
icc = ["metadata"]
limits = ["dep:sysinfo"]

[dependencies]
png = "=0.18.1"
fdeflate = "=0.3.7"
libc = "0.2"
libm = "=0.2.16"
zenpng = { version = "=0.1.4", default-features = false, features = ["quantize"] }
crc32fast = "1.5"
zenjpeg = { version = "=0.8.4", default-features = false, features = ["decoder", "zencodec", "yuv"] }
zenwebp = { version = "=0.4.6", default-features = false, features = ["std", "fast-yuv", "zencodec"] }
zenavif = { version = "=0.1.6", default-features = false, features = ["encode", "zencodec"] }
zenavif-parse = { version = "=0.6.2", default-features = false }
rav1d-safe = { version = "=0.5.7", default-features = false, features = ["bitdepth_8"] }
yuv = { version = "=0.8.20", default-features = false }
moxcms = { version = "=0.8.1", features = ["extended_range"] }
fast-ssim2 = { version = "=0.9.1", default-features = false }
bytemuck = "1.25"
zencodec = "=0.1.26"
imgref = "1"
zenpixels = { version = "=0.2.16", default-features = false }
rgb = { version = "0.8" }
log = "0.4"
# zune-core 0.5.3 would cause build error.
# REF: https://github.com/etemesi254/zune-image/issues/439
zune-core = { version = "=0.5.1", features = ["std"] }
zune-image = { version = "0.5.0", default-features = false, features = ["simd"] }
fast_image_resize = { version = "6.1", optional = true }
imagequant = { version = "4.4", default-features = false, optional = true }
# System resource probing for dynamic image size limits
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "system"], optional = true }

# cli
serde_json = { version = "1.0", optional = true }
lexopt = { version = "0.3.2", optional = true }
glob = { version = "0.3", optional = true }

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[dev-dependencies]
serde_json = { version = "1.0", features = ["float_roundtrip"] }
dav1d = "0.11"
webp = { version = "0.3", default-features = false }
yuvutils-rs = { version = "0.8", default-features = false }
zune-image = { version = "0.5.0", default-features = false, features = ["jpeg"] }
sha2 = "0.10"
filetime = "0.2.29"
lcms2 = "6.2"
zenavif-serialize = "=0.1.4"
enough = "0.4"
rustybench = "=0.5.0"

[[bench]]
name = "workflow"
harness = false
required-features = ["build-binary"]

[[example]]
name = "benchmark"
required-features = ["build-binary"]
