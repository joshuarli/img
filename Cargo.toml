[package]
name = "img"
version = "0.14.0"
edition = "2024"
license = "Apache-2.0"

[lib]
doctest = false

[[bin]]
name = "img"
path = "./src/main.rs"
required-features = ["build-binary"]

[features]
default = ["native-codecs", "resize", "quantization", "metadata"]
native-codecs = ["dep:fdeflate", "png-optimizer", "dep:libc", "dep:libm", "dep:crc32fast", "dep:zune-jpeg", "jpegli", "libjpeg-turbo", "dep:webpkit", "dep:image-webp", "dav1d", "libavif", "dep:yuv", "dep:moxcms", "dep:fast-ssim2", "dep:bytemuck", "dep:zencodec", "dep:zenpixels", "dep:rgb", "dep:log", "dep:zune-core", "dep:zune-image", "dep:quantette", "dep:quantizr"]
png-optimizer = ["dep:oxipng"]
jpegli = ["dep:jpegli-sys"]
libjpeg-turbo = ["dep:libjpeg-turbo-sys"]
dav1d = ["dep:dav1d-sys"]
libavif = ["dep:libavif-sys"]
build-binary = ["native-codecs", "dep:serde_json", "limits", "dep:lexopt", "dep:glob", "icc"]
metadata = ["zune-image/metadata"]
resize = ["dep:fast_image_resize"]
quantization = []
icc = ["metadata"]
limits = ["dep:sysinfo"]

[dependencies]
png = "=0.18.1"
fdeflate = { version = "=0.3.7", optional = true }
oxipng = { version = "=10.2.1", default-features = false, features = ["parallel"], optional = true }
libc = { version = "0.2", optional = true }
libm = { version = "=0.2.16", optional = true }
crc32fast = { version = "1.5", optional = true }
zune-jpeg = { version = "=0.5.15", optional = true }
jpegli-sys = { path = "codecs/jpegli-sys", optional = true }
libjpeg-turbo-sys = { path = "codecs/libjpeg-turbo-sys", optional = true }
# Permissive pure-Rust WebP: decode via image-webp (image-rs), encode via the
# vendored webpkit snapshot staged for the parity campaign (MIT OR Apache-2.0).
webpkit = { path = "codecs/webpkit", version = "0.1.0", features = ["rayon"], optional = true }
image-webp = { version = "=0.2.4", optional = true }
dav1d-sys = { path = "codecs/dav1d-sys", optional = true }
libavif-sys = { path = "codecs/libavif-sys", optional = true }
yuv = { version = "=0.8.20", default-features = false, optional = true }
moxcms = { version = "=0.8.1", features = ["extended_range"], optional = true }
fast-ssim2 = { version = "=0.9.1", default-features = false, optional = true }
bytemuck = { version = "1.25", optional = true }
zencodec = { version = "=0.1.26", optional = true }
zenpixels = { version = "=0.2.16", default-features = false, features = ["std", "icc"], optional = true }
rgb = { version = "0.8", optional = true }
log = { version = "0.4", optional = true }
# zune-core 0.5.3 would cause build error.
# REF: https://github.com/etemesi254/zune-image/issues/439
zune-core = { version = "=0.5.1", features = ["std"], optional = true }
zune-image = { version = "0.5.0", default-features = false, features = ["simd"], optional = true }
fast_image_resize = { version = "6.1", optional = true }
quantette = { version = "=0.6.0", default-features = false, features = ["std", "kmeans"], optional = true }
quantizr = { version = "=1.4.3", optional = true }
# System resource probing for dynamic image size limits
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "system"], optional = true }

# cli
serde_json = { version = "1.0", optional = true }
lexopt = { version = "0.3.2", optional = true }
glob = { version = "0.3", optional = true }

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[dev-dependencies]
rayon = "1.12"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
webp = { version = "0.3", default-features = false }
yuvutils-rs = { version = "0.8", default-features = false }
zune-image = { version = "0.5.0", default-features = false, features = ["jpeg"] }
sha2 = "0.10"
filetime = "0.2.29"
lcms2 = "6.2"
zenavif-serialize = "=0.1.4"
enough = "0.4"
rustybench = "=0.5.0"

[[bench]]
name = "workflow"
harness = false
required-features = ["build-binary"]

[[example]]
name = "benchmark"
required-features = ["build-binary"]

[patch.crates-io]
oxipng = { path = "vendor/oxipng" }
libdeflater = { path = "vendor/libdeflater" }
libdeflate-sys = { path = "vendor/libdeflate-sys" }
fast-ssim2 = { path = "vendor/fast-ssim2" }
